<!doctype html>
<html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'"><link rel="icon" href="alo-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Noto+Sans+Arabic:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css?v=2"><title>Alo Solar Energy | Admin</title></head>
<body><header><a href="index.html"><img src="alo-logo.png" alt=""><b>Alo Solar Energy</b></a><span>Installers Admin</span></header><main>
<section class="login" id="adminLogin"><h1>چوونەژوورەوەی Admin</h1><p>بۆ بەڕێوەبردنی داواکاری و نرخەکانی وەستاکان</p><form id="adminLoginForm"><label>Username<input id="adminUsername" autocomplete="username" required dir="ltr"></label><label>Password<input id="adminPassword" type="password" autocomplete="current-password" required dir="ltr"></label><button>چوونەژوورەوە</button><p class="msg" id="adminLoginError"></p></form></section>
<section class="panel hidden" id="adminPanel"><div class="heading"><div><span>ADMIN PANEL</span><h1>بەڕێوەبردنی بەشی وەستاکان</h1></div><button id="adminLogout" class="outline">دەرچوون</button></div><nav><button class="active" data-view="applications">داواکارییەکان <i id="pendingCount">0</i></button><button data-view="prices">بەرهەم و نرخەکان</button></nav>
<div id="applicationsView"><div class="cards" id="applications"></div></div>
<div id="pricesView" class="hidden"><form id="addProductForm" class="product-form"><h2>زیادکردنی بابەتی نوێ</h2><div class="form-grid"><label>جۆر<select id="newType" required><option value="panel">پانێڵ</option><option value="inverter">ئینڤێرتەر</option><option value="battery">باتری</option><option value="service">خزمەتگوزاری</option></select></label><label>ناوی بابەت<input id="newName" required maxlength="120"></label><label>مواصفات<input id="newSpec" maxlength="240"></label><label>نرخی ئاسایی<input id="newRetail" type="number" min="0" step="0.01" required></label><label>نرخی وەستا<input id="newTrade" type="number" min="0" step="0.01" required></label><label>ڕیزبەندی<input id="newSort" type="number" min="0" step="1" value="0"></label></div><button type="submit">زیادکردنی بابەت</button></form><div class="table-wrap"><table><thead><tr><th>جۆر</th><th>ناو و مواصفات</th><th>نرخی ئاسایی</th><th>نرخی وەستا</th><th>ڕیز</th><th>چالاک</th><th>کردار</th></tr></thead><tbody id="priceRows"></tbody></table></div></div><p class="msg" id="adminMessage"></p></section>
</main><script src="admin.js?v=2"></script></body></html>
